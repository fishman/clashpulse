name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      version:
        description: Release version embedded in the binary and artifact names, for example v0.1.0.
        required: true
        type: string

jobs:
  # Cross-platform static checks. Linux and Windows run as one staticcheck
  # matrix so code used on only one of them is not reported as unused; darwin
  # needs cgo for Fyne and runs natively in its desktop job instead.
  checks:
    runs-on: ubuntu-22.04
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go toolchain
        run: go version
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 -tags ci ./...
      - name: staticcheck (linux, windows)
        run: |
          printf 'linux: GOOS=linux -tags=ci\nwindows: GOOS=windows -tags=ci\n' | go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -matrix ./...

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the glibc floor at 2.35; newer runners raise both the
          # glibc and the x86-64 ISA level the release binary demands.
          - os: ubuntu-22.04
            target: linux
            arch: amd64
          # mihomo names the packaging/mihomo.lock target bundled in the package.
          - os: macos-latest
            target: darwin
            arch: arm64
            mihomo: darwin-arm64
          - os: macos-26-intel
            target: darwin
            arch: amd64
            mihomo: darwin-amd64
          - os: windows-latest
            target: windows
            arch: amd64
            mihomo: windows-amd64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ inputs.version || 'dev' }}
      # The ISA level of cgo objects must not follow the runner's compiler default.
      CGO_CFLAGS: ${{ matrix.target == 'linux' && '-O2 -g -march=x86-64 -mtune=generic' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Linux graphics headers
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev libwayland-dev libxkbcommon-dev wayland-protocols
      - name: Tests and vet
        shell: bash
        run: |
          a=.github/scripts/annotate-failures.sh
          race=; [ "${{ matrix.target }}" = linux ] && race=-race
          bash "$a" "tests ${{ matrix.target }}" go test -tags ci $race -timeout 8m ./...
          bash "$a" "vet ${{ matrix.target }}" go vet -tags ci ./...
          if [ "${{ matrix.target }}" = darwin ]; then
            # Unused code is checked by the linux/windows matrix in the checks job.
            bash "$a" "staticcheck darwin" go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -tags ci -checks inherit,-U1000 ./...
          fi
      - name: Native desktop package
        shell: bash
        run: |
          name="clashpulse-$VERSION-${{ matrix.target }}-${{ matrix.arch }}"
          ldflags="-s -w -X 'main.version=clashpulse $VERSION'"
          a=.github/scripts/annotate-failures.sh
          mkdir -p package dist
          # Fetch the pinned Mihomo into $1 and record its digest in the build identity.
          bundle_mihomo() {
            mkdir -p "$2"
            cp packaging/mihomo/LICENSE "$2/mihomo-LICENSE.txt"
            fetched=$(go run ./tools/fetch-mihomo -target ${{ matrix.mihomo }} -out "$1" -provenance "$2/mihomo-PROVENANCE.txt")
            eval "$fetched"
            [ -n "$version" ] && [ -n "$sha256" ] || { echo "::error::fetch-mihomo reported no identity"; exit 1; }
            ldflags="$ldflags -X 'github.com/fishman/clashpulse/internal/bundled.Version=$version' -X 'github.com/fishman/clashpulse/internal/bundled.SHA256=$sha256'"
          }
          # The linker ignores a mistyped -X path, which would ship a package
          # that silently defaults to system Mihomo.
          require_identity() {
            grep -aq "$sha256" "$1" || { echo "::error::$1 does not embed the bundled Mihomo digest"; exit 1; }
          }
          case "${{ matrix.target }}" in
            linux)
              bash "$a" "build ${{ matrix.target }}" go build -buildmode=pie -trimpath -ldflags "$ldflags -linkmode=external -extldflags=-Wl,-z,relro,-z,now" -o package/clashpulse ./cmd/clashpulse
              cp README.md LICENSE THIRD_PARTY_LICENSES.txt clashpulse.desktop package/
              tar -czf "dist/$name.tar.gz" -C package .
              ;;
            darwin)
              bundle=package/ClashPulse.app/Contents
              mkdir -p "$bundle/MacOS" "$bundle/Resources"
              bundle_mihomo "$bundle/Resources/mihomo" "$bundle/Resources/licenses"
              bash "$a" "build ${{ matrix.target }}" go build -trimpath -ldflags "$ldflags" -o "$bundle/MacOS/clashpulse" ./cmd/clashpulse
              require_identity "$bundle/MacOS/clashpulse"
              printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<plist version="1.0"><dict>' '<key>CFBundleIdentifier</key><string>io.github.fishman.clashpulse</string>' '<key>CFBundleName</key><string>ClashPulse</string>' '<key>CFBundleExecutable</key><string>clashpulse</string>' "<key>CFBundleShortVersionString</key><string>${VERSION#v}</string>" '<key>CFBundlePackageType</key><string>APPL</string>' '</dict></plist>' > "$bundle/Info.plist"
              cp README.md LICENSE THIRD_PARTY_LICENSES.txt "$bundle/Resources/"
              tar -czf "dist/$name.tar.gz" -C package ClashPulse.app
              ;;
            windows)
              bundle_mihomo package/mihomo.exe package/licenses
              bash "$a" "build ${{ matrix.target }}" go build -trimpath -ldflags "$ldflags" -o package/clashpulse.exe ./cmd/clashpulse
              require_identity package/clashpulse.exe
              cp README.md LICENSE THIRD_PARTY_LICENSES.txt package/
              powershell.exe -NoProfile -Command "Compress-Archive -Path 'package/*' -DestinationPath 'dist/$name.zip'"
              ;;
          esac
      - name: Smoke-run the packaged binary
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            linux) out=$(package/clashpulse version) ;;
            darwin) out=$(package/ClashPulse.app/Contents/MacOS/clashpulse version); mihomo=package/ClashPulse.app/Contents/Resources/mihomo ;;
            windows) out=$(package/clashpulse.exe version); mihomo=package/mihomo.exe ;;
          esac
          if [ -n "${{ matrix.mihomo }}" ]; then
            "$mihomo" -v
            home="$RUNNER_TEMP/mihomo-check"; mkdir -p "$home"
            printf 'proxies:\n  - name: check\n    type: direct\n' > "$home/check.yaml"
            "$mihomo" -d "$home" -t -f "$home/check.yaml"
          fi
          echo "$out"
          if [ "${{ matrix.target }}" = linux ]; then
            isa=$(readelf -n package/clashpulse | grep -i 'ISA needed' || true)
            echo "${isa:-no ISA note}"
            if echo "$isa" | grep -Eq 'x86-64-v[234]'; then echo "::error::binary requires more than baseline x86-64: $isa"; exit 1; fi
            readelf -h package/clashpulse | grep -q 'Position-Independent' || { echo "::error::linux binary is not PIE"; exit 1; }
            readelf -d package/clashpulse | grep -q BIND_NOW || { echo "::error::linux binary lacks full RELRO"; exit 1; }
            glibc=$(objdump -T package/clashpulse | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
            echo "highest glibc symbol: $glibc"
            if [ "$(printf '%s\nGLIBC_2.35\n' "$glibc" | sort -V | tail -1)" != GLIBC_2.35 ]; then echo "::error::binary needs $glibc, above the 2.35 floor"; exit 1; fi
          fi
          test "$out" = "clashpulse $VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: clashpulse-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # Windows on ARM runs the amd64 package under x64 emulation; this proves
  # both executables start there, not that the GUI opens.
  smoke-windows-arm:
    needs: desktop
    runs-on: windows-11-arm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clashpulse-windows-amd64
          path: dist
      - name: Smoke-run the amd64 package under emulation
        shell: bash
        env:
          VERSION: ${{ inputs.version || 'dev' }}
        run: |
          powershell.exe -NoProfile -Command "Expand-Archive -Path (Get-ChildItem dist/*.zip) -DestinationPath package"
          out=$(package/clashpulse.exe version)
          echo "$out"
          test "$out" = "clashpulse $VERSION"
          package/mihomo.exe -v
