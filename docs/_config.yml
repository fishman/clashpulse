title: ClashPulse
description: A lightweight desktop client for Mihomo that measures nodes and switches only on proven improvement
remote_theme: just-the-docs/just-the-docs@v0.10.1

# the repo link in the top-right of every page (just-the-docs aux_links)
aux_links:
  "View on GitHub":
    - "https://github.com/fishman/clashpulse"
aux_links_new_tab: true

# agent-working docs (plans, specs, handoffs) and blog drafts: Go and
# workflow literals in code blocks contain {{ which Liquid parses as
# template tags - not site content
exclude:
  - superpowers
  - blog
