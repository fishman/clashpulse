# Default ClashPulse keymap: one context table per TUI surface.
# Only show=true entries appear in the compact keyhint; help lists all.

[schemes.default.global]
"q" = { fun = "quit", desc = "quit", show = true, inherit = true }
"ctrl+c" = { fun = "quit", desc = "quit", show = true, inherit = true }
"?" = { fun = "toggle_help", desc = "show keyboard help", show = true, inherit = true }
"tab" = { fun = "next_tab", desc = "next tab", inherit = true }
"shift+tab" = { fun = "prev_tab", desc = "previous tab", inherit = true }
"up" = { fun = "move_up", desc = "move up", inherit = true }
"k" = { fun = "move_up", desc = "move up", inherit = true }
"down" = { fun = "move_down", desc = "move down", inherit = true }
"j" = { fun = "move_down", desc = "move down", inherit = true }
"enter" = { fun = "activate", desc = "activate", show = true, inherit = true }
"esc" = { fun = "cancel_modal", desc = "close modal", inherit = true }
"1" = { fun = "tab_overview", desc = "Overview", inherit = true }
"2" = { fun = "tab_proxies", desc = "Proxies", inherit = true }
"3" = { fun = "tab_subscriptions", desc = "Subscriptions", inherit = true }
"4" = { fun = "tab_filters", desc = "Filter Lists", inherit = true }
"5" = { fun = "tab_resources", desc = "Data Resources", inherit = true }
"6" = { fun = "tab_settings", desc = "Settings", inherit = true }
"~" = { fun = "toggle_log", desc = "toggle session log", show = true, inherit = true }

[schemes.default.overview]
"s" = { fun = "start", desc = "enqueue start", show = true }
"x" = { fun = "stop", desc = "enqueue stop", show = true }
"r" = { fun = "reload_configuration", desc = "reload configuration", show = true }

[schemes.default.proxies]
